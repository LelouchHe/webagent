# Template only: every suite run substitutes these two lines with its own
# port and run directory (test/e2e/run-context.ts). Do not read this file
# directly from a spec.
port = 6802
data_dir = "test/e2e-data"
public_dir = "dist-dev"
default_agent = "mock"
[agents.mock]
cmd = "node --experimental-strip-types test/e2e/mock-agent.ts"

[limits]
bash_output = 1_048_576
image_upload = 10_485_760

[share]
enabled = true
ttl_hours = 0
csp_enforce = true
viewer_origin = ""
internal_hosts = []
