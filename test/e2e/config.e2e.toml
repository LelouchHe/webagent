# Template only: every suite run substitutes these two lines with its own
# port and run directory (test/e2e/run-context.ts). Do not read this file
# directly from a spec.
port = 6802
data_dir = "test/e2e-data"
public_dir = "dist-dev"
default_agent = "mock"
[agents.mock]
cmd = "node --experimental-strip-types test/e2e/mock-agent.ts"

[limits]
bash_output = 1_048_576
image_upload = 10_485_760

[share]
enabled = true
ttl_hours = 0
csp_enforce = true
viewer_origin = ""
internal_hosts = []

# A second configured agent: the same stub binary with a different execution
# environment. Its schema reports its own defaults (`mock2-model`, `chat#plan`,
# `high`), each placed after the first option, so "this agent's default" is
# distinguishable from option order and from `mock`'s values. It is started only
# when a task targets it; a metadata read never starts it.
[agents.mock2]
cmd = "node --experimental-strip-types test/e2e/mock-agent.ts load - 0 model=mock2-model,mode=chat#plan,reasoning=high"
